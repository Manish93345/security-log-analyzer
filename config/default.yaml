# slrag defaults — loaded by src/slrag/config.py, overridden by .env
# Keep this file free of secrets. It documents every tunable in one place.

llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.0
  max_retries: 4
  request_timeout_s: 60

embeddings:
  backend: fastembed
  model: BAAI/bge-small-en-v1.5
  batch_size: 64

retrieval:
  retrieve_top_k: 5          # windows returned to the LLM
  candidate_pool: 50         # per-retriever pool before fusion
  rrf_k: 60                  # Reciprocal Rank Fusion constant
  rerank_enabled: true
  rerank_backend: fastembed  # fastembed | flashrank | none
  rerank_model: ms-marco-MiniLM-L-6-v2   # aliased to Xenova/ms-marco-MiniLM-L-6-v2
  index_batch_size: 256      # windows per Chroma add (memory guard while indexing)
  chroma_collection: slrag_windows
  bm25:
    k1: 1.5
    b: 0.75
    max_tokens: 512          # per-window token cap; bounds the in-memory BM25 index

chunking:
  gap_minutes: 15            # incident-window merge threshold
  max_chars: 4800            # ~1200 tokens
  max_events_per_chunk: 120

guardrails:
  enabled: true
  max_prompt_tokens: 12000
  redact_patterns:
    - "AKIA[0-9A-Z]{16}"
    - "ASIA[0-9A-Z]{16}"
    - "(?i)bearer\\s+[A-Za-z0-9._\\-]{20,}"
    - "(?i)password\\s*[=:]\\s*\\S+"

eval:
  recall_ks: [1, 3, 5]
  mrr_k: 10
  target_recall_at_3: 0.89
